services:
  - type: web
    name: supportdesk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # the ai key
      - key: GROQ_API_KEY
        sync: false
      # password for the admin account
      - key: ADMIN_PASSWORD
        sync: false
      # keeps logins working after a restart
      - key: SESSION_SECRET
        generateValue: true
      # optional, a postgres address so nothing is lost on restart
      - key: DATABASE_URL
        sync: false
      # optional, email alerts
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: PUBLIC_URL
        sync: false
